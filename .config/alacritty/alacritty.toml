[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 11.5

[terminal.shell]
program = "tmux"

[env]
TERM = "xterm-256color"

[mouse]
hide_when_typing = true

[window]
decorations = "None"
startup_mode = "Maximized"

[keyboard]
bindings = [{ key = "Enter", mods = "Control", action = "ToggleFullscreen" }]

[colors.primary]
background = "#131313"
foreground = "#fcfcfc"

[colors.normal]
black = "#232627"
red = "#ed1515"
green = "#11d116"
yellow = "#f67400"
blue = "#1d99f3"
magenta = "#9b59b6"
cyan = "#1abc9c"
white = "#fcfcfc"

[colors.bright]
black = "#7f8c8d"
red = "#c0392b"
green = "#1cdc9a"
yellow = "#fdbc4b"
blue = "#3daee9"
magenta = "#8e44ad"
cyan = "#16a085"
white = "#ffffff"

[colors.dim]
black = "#31363b"
red = "#783228"
green = "#17a262"
yellow = "#b65619"
blue = "#1b668f"
magenta = "#614a73"
cyan = "#186c60"
white = "#63686d"
