[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 11.5

[terminal.shell]
program = "tmux"

[env]
TERM = "xterm-256color"

[mouse]
hide_when_typing = true

[window]
# decorations = "None"
decorations_theme_variant = "Dark"
startup_mode = "Maximized"
padding = { x = 2, y = 2 }

[keyboard]
bindings = [{ key = "Enter", mods = "Control", action = "ToggleFullscreen" }]

[colors.primary]
background = '#1D1D20'
foreground = "#D9D9D9"
